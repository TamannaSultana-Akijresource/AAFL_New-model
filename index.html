<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAFL - S&OP Control Tower | Statistical Forecasting Engine</title>
<style>
:root{--bg:#070c13;--bar:#0b131d;--panel:#0d1723;--panel2:#0f1b29;--border:#1b2c3f;--text:#c9d6e5;--muted:#6f8399;--gold:#d4a72c;--blue:#4d9fff;--green:#3ddc84;--red:#ff5c5c;--amber:#ffb020}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.45}
.topbar{display:flex;align-items:center;justify-content:space-between;background:var(--bar);border-bottom:1px solid var(--border);padding:14px 26px}
.topbar .brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;color:#e8eef6}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.closebtn{background:#101d2c;border:1px solid var(--border);color:#b9c7d6;border-radius:6px;padding:8px 16px;font-size:12px;cursor:pointer}
.closebtn:hover{border-color:var(--gold);color:var(--gold)}
.tabs{display:flex;gap:34px;padding:0 26px;background:var(--bar);border-bottom:1px solid var(--border)}
.tab{padding:17px 2px;font-size:14px;color:#93a7bc;cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:#fff;border-bottom-color:var(--gold);font-weight:600}
.wrap{padding:22px 26px 40px}
.toolbar{display:flex;gap:22px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:220px}
.field.grow{flex:1;min-width:280px}
.field.hide{display:none}
.field label{font-size:10.5px;letter-spacing:1.1px;color:var(--muted);text-transform:uppercase;font-weight:600}
.field select,.field input{background:#0c1622;border:1px solid var(--border);color:#dbe6f2;border-radius:7px;padding:11px 12px;font-size:13px;outline:none;width:100%}
.field select:focus,.field input:focus{border-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:16px}
.kpi{background:linear-gradient(180deg,#0e1a28,#0b141f);border:1px solid var(--border);border-radius:9px;padding:18px 20px}
.kpi .lbl{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-size:30px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.g .val{color:var(--green)}.kpi.r .val{color:var(--red)}.kpi.a .val{color:var(--amber)}.kpi.n .val{color:#aebccb}
.caption{color:var(--muted);font-size:12px;margin:4px 0 12px}
.caption b{color:#9fb3c8;font-weight:600}
.panel{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--panel)}
.panel-head{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);padding:12px 16px;border-bottom:1px solid var(--border)}
.panel-head .title{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#9db0c4;font-weight:600}
.panel-head .right{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted)}
.mini{background:#101d2c;border:1px solid var(--border);color:#b9c7d6;border-radius:5px;padding:5px 10px;font-size:11px;cursor:pointer}
.mini:hover{border-color:var(--gold);color:var(--gold)}
.tbl-wrap{max-height:640px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
thead th{position:sticky;top:0;background:#0b1622;color:#8ea3b8;font-weight:600;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;text-align:right;padding:10px 12px;border-bottom:1px solid var(--border);z-index:2}
thead th:first-child,thead th.l{text-align:left}
thead th.month.actcol{color:var(--gold)}
tbody td{padding:9px 12px;border-bottom:1px solid #12202e;text-align:right;font-variant-numeric:tabular-nums;font-family:Consolas,'Courier New',monospace;color:#cfdcea}
tbody td.l{text-align:left;font-family:'Segoe UI',system-ui,sans-serif}
tbody td.code{color:var(--blue);font-weight:600;cursor:pointer}
tbody td.desc{color:#dfe9f3;font-weight:500;max-width:280px;white-space:normal}
tbody td.cat{color:var(--muted)}
tbody tr:hover td{background:rgba(77,159,255,.045)}
tbody td.actcol{background:rgba(212,167,44,.05)}
thead th.actcol{background:#141c22}
.act-inp{width:96px;background:#0a1420;border:1px solid #2a4258;border-radius:4px;color:#ffe9a8;text-align:right;padding:5px 7px;font-family:Consolas,monospace;font-size:12.5px;outline:none}
.act-inp:focus{border-color:var(--gold);background:#101c2a}
.acc-pos{color:var(--green)}.acc-mid{color:var(--amber)}.acc-neg{color:var(--red)}
.totalrow td{background:#0b1622;border-top:2px solid var(--gold);font-weight:700;color:#fff}
.muted{color:var(--muted)}
.foot{margin-top:16px;color:var(--muted);font-size:11.5px}
.dead{display:none}
@media(max-width:1000px){.kpis{grid-template-columns:1fr}.field{min-width:100%}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"></span>S&amp;OP Control Tower &mdash; Statistical Forecasting Engine</div>

<div class="wrap">

  <div class="caption" id="caption"></div>

        <button class="mini" onclick="resetActuals()">Reset actuals</button>

    </div>
    <div class="tbl-wrap"><table id="tbl"></table></div>

const MONTHS = DATA.months, LABELS = DATA.monthLabels, MODELS = DATA.models;
const M_IDX = {}; MONTHS.forEach((m,i)=>M_IDX[m]=i);
const modelLabel = {'Ensemble (RF+TimesFM)':'Ensemble (RF+TimesFM)'};
let state = { tab:'sku', model:DATA.ensModel, search:'', actualMonth:MONTHS[0] };
const KEY = 'AAFL_SOP_ACTUALS_V1';
let actuals = {};
try { actuals = JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){ actuals = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(actuals)); }catch(e){} }

const fmt = v => (v==null||isNaN(v)) ? '&mdash;' : Number(v).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
const fmt0 = v => (v==null||isNaN(v)) ? '&mdash;' : Math.round(v).toLocaleString();
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
function median(a){ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y); const n=b.length; return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2; }

// ---------- dropdowns ----------
const sbuSel=document.getElementById('sbu');
sbuSel.innerHTML='<option>'+DATA.meta.sbuLabel+'</option>';
const modelSel=document.getElementById('model');
modelSel.innerHTML=MODELS.map(m=>'<option'+(m===DATA.ensModel?' selected':'')+'>'+m+'</option>').join('');
const monSel=document.getElementById('actualMonth');
monSel.innerHTML=MONTHS.map((m,i)=>'<option'+(i===0?' selected':'')+'>'+m+'</option>').join('');
modelSel.onchange=()=>{ state.model=modelSel.value; render(); };
monSel.onchange=()=>{ state.actualMonth=monSel.value; render(); };
document.getElementById('search').oninput=e=>{ state.search=e.target.value.toLowerCase(); render(); };

function setTab(t){
  state.tab=t;
  document.getElementById('tabSku').classList.toggle('active', t==='sku');
  document.getElementById('tabCons').classList.toggle('active', t==='cons');
  document.getElementById('searchField').classList.toggle('hide', t!=='sku');
  document.getElementById('actualMonthField').classList.toggle('hide', t!=='sku');
  render();
}

// ---------- accuracy ----------
function skuKpis(){
  const model=state.model, mi=M_IDX[state.actualMonth], errs=[], bis=[];
  DATA.skus.forEach(s=>{
    const a=actuals[s.code+'|'+state.actualMonth];
    if(a>0 && s.fc[model]){ const f=s.fc[model][mi]; errs.push(Math.abs(a-f)/a*100); bis.push((f-a)/a*100); }
  });
  if(errs.length) return {mode:'live', n:errs.length, total:DATA.skus.length, mape:median(errs), bias:median(bis)};
  const ms=[],bs=[];
  DATA.skus.forEach(s=>{ const b=s.bt[model]; if(b && b.mape!=null){ ms.push(b.mape); if(b.bias!=null) bs.push(b.bias); } });
  return {mode:'backtest', n:ms.length, total:DATA.skus.length, mape:median(ms), bias:median(bs)};
}
function consKpis(){
  const model=state.model, errs=[], bis=[];
  MONTHS.forEach((m,i)=>{
    const a=actuals['CONS|'+m];
    if(a>0){ const f=DATA.consForecast[model][i]; errs.push(Math.abs(a-f)/a*100); bis.push((f-a)/a*100); }
  });
  if(errs.length) return {mode:'live', n:errs.length, total:12, mape:mean(errs), bias:mean(bis)};
  const mt=DATA.consMetrics[model];
  return {mode:'backtest', n:6, total:12, mape:mt.mape, bias:mt.bias};
}
function paintKpis(k){
  const acc = k.mape==null?null:Math.max(0,100-k.mape);
  const set=(id,val,cls)=>{ const el=document.getElementById(id); el.textContent=val; el.className='val'; if(cls) el.classList.add(cls); };
  document.getElementById('kpiAcc').className='kpi '+(acc==null?'n':acc>=85?'g':acc>=70?'a':'r');
  document.getElementById('kpiBias').className='kpi '+(k.bias==null?'n':Math.abs(k.bias)<=5?'g':Math.abs(k.bias)<=15?'a':'r');
  document.getElementById('kpiMape').className='kpi '+(k.mape==null?'n':k.mape<=10?'g':k.mape<=25?'a':'r');
  set('valAcc', acc==null?'&mdash;':acc.toFixed(1)+'%');
  set('valBias', k.bias==null?'&mdash;':(k.bias>0?'+':'')+k.bias.toFixed(1)+'%');
  set('valMape', k.mape==null?'&mdash;':k.mape.toFixed(1)+'%');
  document.getElementById('lblAcc').textContent = k.mode==='live'?'Accuracy':'Accuracy (backtest)';
  document.getElementById('lblBias').textContent = k.mode==='live'?'Bias':'Bias (backtest)';
  document.getElementById('lblMape').textContent = k.mode==='live'?'MAPE':'MAPE (backtest)';
}

function caption(){
  const c=document.getElementById('caption');
  if(state.tab==='sku'){
    const k=skuKpis();
    const base = '<b>'+DATA.meta.sbu+'</b> &middot; '+state.model+' &middot; ';
    if(k.mode==='live')
      c.innerHTML = base+'MEDIAN across <b>'+k.n+' of '+k.total+'</b> validated SKUs &middot; actual month <b>'+state.actualMonth+'</b> &middot; all values in Metric Ton.';
    else
      c.innerHTML = base+'6-month backtest, MEDIAN across <b>'+k.n+' of '+k.total+'</b> SKUs &mdash; enter actuals in the gold column to compute live accuracy.';
  } else {
    const k=consKpis();
    if(k.mode==='live')
      c.innerHTML = '<b>'+DATA.meta.sbu+' consolidated</b> = sum of '+DATA.skus.length+' SKUs, all in Metric Ton &middot; '+state.model+' &middot; live accuracy from <b>'+k.n+' of 12</b> months with actuals.';
    else
      c.innerHTML = '<b>'+DATA.meta.sbu+' consolidated</b> = sum of '+DATA.skus.length+' SKUs &middot; '+state.model+' &middot; 6-month backtest accuracy &mdash; enter monthly actuals to switch to live.';
  }
}

// ---------- render ----------
function render(){
  document.getElementById('panelTitle').textContent =
    state.tab==='sku' ? 'STAT FCAST SKU WISE (METRIC TON) — '+state.model.toUpperCase()
                      : 'STAT FCAST (METRIC TON) — '+state.model.toUpperCase();
  document.getElementById('panelMeta').textContent =
    state.tab==='sku' ? DATA.skus.length+' SKUs' : 'FY26-27';
  paintKpis(state.tab==='sku'?skuKpis():consKpis());
  caption();
  if(state.tab==='sku') renderSku(); else renderCons();
}

function accClass(a){ return a>=85?'acc-pos':a>=70?'acc-mid':'acc-neg'; }

function renderSku(){
  const model=state.model, mi=M_IDX[state.actualMonth];
  let rows = DATA.skus;
  if(state.search) rows = rows.filter(s=>(s.name+' '+s.code+' '+s.cat).toLowerCase().includes(state.search));
  let h='<thead><tr><th class="l">Item Code</th><th class="l">Description</th><th class="l">UOM</th>';
  LABELS.forEach((L,i)=>{ h+='<th class="month'+(i===mi?' actcol':'')+'">'+L+'</th>'; });
  h+='<th>BT SMAPE %</th><th class="actcol">Actual '+state.actualMonth+'</th><th>Acc %</th></tr></thead><tbody>';
  rows.forEach(s=>{
    const f=s.fc[model]||[];
    h+='<tr data-code="'+s.code+'">';
    h+='<td class="l code">'+(s.code||'&mdash;')+'</td><td class="l desc">'+s.name+'</td><td class="l cat">'+s.uom+'</td>';
    for(let i=0;i<12;i++) h+='<td'+(i===mi?' class="actcol"':'')+'>'+fmt(f[i])+'</td>';
    h+='<td class="muted">'+(s.bt[model]?s.bt[model].smape.toFixed(1):'&mdash;')+'</td>';
    const av=actuals[s.code+'|'+state.actualMonth];
    h+='<td class="actcol"><input class="act-inp" data-kind="sku" data-code="'+s.code+'" data-key="'+s.code+'|'+state.actualMonth+'" type="number" step="0.1" value="'+(av!=null?av:'')+'" placeholder="0.0"></td>';
    h+='<td class="acc" data-acc="'+s.code+'">&mdash;</td></tr>';
  });
  h+='</tbody>';
  document.getElementById('tbl').innerHTML=h;
  rows.forEach(s=>updateSkuAcc(s));
}

function updateSkuAcc(s){
  const mi=M_IDX[state.actualMonth];
  const a=actuals[s.code+'|'+state.actualMonth];
  const cel=document.querySelector('td[data-acc="'+CSS.escape(s.code)+'"]');
  if(!cel) return;
  if(a>0){ const f=(s.fc[state.model]||[])[mi]; const acc=100-Math.abs(a-f)/a*100; cel.textContent=acc.toFixed(1); cel.className='acc '+accClass(acc); }
  else { cel.textContent='—'; cel.className='acc muted'; }
}

function renderCons(){
  const model=state.model;
  let h='<thead><tr><th class="l">Date</th><th>LY Sales</th><th>FY26-27 Budget</th><th>Demand Forecast</th>';
  MODELS.forEach(m=>{ h+='<th>'+m+'</th>'; });
  h+='<th class="actcol">Actual Sales</th><th>Acc %</th></tr></thead><tbody>';
  let tLy=0,tBg=0,tFc=0,tAct=0,anyAct=false;
  const tMod={}; MODELS.forEach(m=>tMod[m]=0);
  MONTHS.forEach((m,i)=>{
    const ly=DATA.lyConsolidated[i], bg=DATA.budget[i], df=DATA.consForecast[model][i];
    tLy+=ly||0; tBg+=bg||0; tFc+=df||0;
    MODELS.forEach(mm=>tMod[mm]+=DATA.consForecast[mm][i]||0);
    const av=actuals['CONS|'+m];
    if(av>0){ tAct+=av; anyAct=true; }
    h+='<tr data-month="'+m+'"><td class="l code">'+mlab(m)+'</td>';
    h+='<td>'+fmt(ly)+'</td><td>'+fmt(bg)+'</td><td style="color:#fff;font-weight:700">'+fmt(df)+'</td>';
    MODELS.forEach(mm=>{ h+='<td'+(mm===model?' style="color:#cfe6ff"':' class="muted"')+'>'+fmt(DATA.consForecast[mm][i])+'</td>'; });
    h+='<td class="actcol"><input class="act-inp" data-kind="cons" data-key="CONS|'+m+'" type="number" step="0.1" value="'+(av!=null?av:'')+'" placeholder="0.0"></td>';
    h+='<td class="acc" data-acc="CONS|'+m+'">&mdash;</td></tr>';
  });
  h+='<tr class="totalrow"><td class="l">Total</td><td>'+fmt(tLy)+'</td><td>'+fmt(tBg)+'</td><td>'+fmt(tFc)+'</td>';
  MODELS.forEach(mm=>{ h+='<td>'+fmt(tMod[mm])+'</td>'; });
  h+='<td class="actcol">'+(anyAct?fmt(tAct):'&mdash;')+'</td><td class="acc" id="consAccTot">&mdash;</td></tr>';
  h+='</tbody>';
  document.getElementById('tbl').innerHTML=h;
  MONTHS.forEach((m,i)=>updateConsAcc(m));
  // overall accuracy (all entered months)
  const k=consKpis();
  if(k.mode==='live' && k.mape!=null){ const a=Math.max(0,100-k.mape); const el=document.getElementById('consAccTot'); el.textContent=a.toFixed(1); el.className='acc '+accClass(a); }
}

function mlab(ym){ const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const p=ym.split('-'); return M[+p[1]-1]+'-'+p[0]; }

function updateConsAcc(m){
  const cel=document.querySelector('td[data-acc="CONS|'+CSS.escape(m)+'"]');
  if(!cel) return;
  const a=actuals['CONS|'+m]; const i=M_IDX[m]; const f=DATA.consForecast[state.model][i];
  if(a>0){ const acc=100-Math.abs(a-f)/a*100; cel.textContent=acc.toFixed(1); cel.className='acc '+accClass(acc); }
  else { cel.textContent='—'; cel.className='acc muted'; }
}

// ---------- editable actuals ----------
document.addEventListener('input', function(e){
  const t=e.target; if(!t.classList || !t.classList.contains('act-inp')) return;
  const key=t.dataset.key; const raw=t.value.trim();
  if(raw===''){ delete actuals[key]; } else { const n=parseFloat(raw); if(isNaN(n)) return; actuals[key]=n; }
  save();
  if(t.dataset.kind==='sku'){
    const code=t.dataset.code; const s=DATA.skus.find(x=>x.code===code); if(s) updateSkuAcc(s);
  } else {
    updateConsAcc(key.split('|')[1]);
    const k=consKpis();
    if(k.mode==='live'&&k.mape!=null){ const a=Math.max(0,100-k.mape); const el=document.getElementById('consAccTot'); if(el){el.textContent=a.toFixed(1); el.className='acc '+accClass(a);} }
  }
  paintKpis(state.tab==='sku'?skuKpis():consKpis());
  caption();
});

function exportActuals(){
  const lines=['key,value'];
  Object.keys(actuals).sort().forEach(k=>lines.push(k+','+actuals[k]));
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='AAFL_actuals_'+DATA.meta.generated.replace(/[: ]/g,'-')+'.csv'; a.click();
}
function resetActuals(){ if(confirm('Clear all entered actuals from this browser?')){ actuals={}; save(); render(); } }

// init
render();
</script>
</body>
</html>
